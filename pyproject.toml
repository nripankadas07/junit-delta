[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "junit-delta"
version = "0.1.0"
description = "Compares JUnit runs by nested suite/class/test identity and gates new failures, skips, removals and timing increases."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Dr. Nripanka Das"}]
dependencies = []

[project.urls]
Repository = "https://github.com/nripankadas07/junit-delta"
Issues = "https://github.com/nripankadas07/junit-delta/issues"

[project.scripts]
junit-delta = "junit_delta:main"

[tool.setuptools]
py-modules = ["junit_delta"]
